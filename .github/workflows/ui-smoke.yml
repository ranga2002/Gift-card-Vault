name: Vault UI smoke tests
on:
  push:
    branches: [main, feature/vault-upgrade-20261119]
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run smoke tests
        run: npm test
