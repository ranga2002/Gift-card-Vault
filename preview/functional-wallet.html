<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gift Vault — Functional Wallet Preview</title><style>/* Authenticated Gift Vault wallet UI: separate from classic management screens */

</style></head><body>
<div id="sample-indicator" style="font:700 11px system-ui;padding:9px 15px;text-align:center;background:#1c3540;color:#c5f9e5">INTERACTIVE PREVIEW · SAMPLE CARDS · NO REAL ACCOUNT CONNECTED</div>
<div id="appScreen" style="display:block"></div>
<script>
(function(){
  const plusDays=n=>{const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+n);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-")};
  const demo={
    cards:[
      {id:"card-a",store:"Starbucks",account:"Personal",type:"Gift Card / Wallet",amount:50,initialAmount:60,currency:"CAD",expiry:plusDays(3),notes:"",status:"active",hasSecretCode:true,codeVisibility:"private"},
      {id:"card-b",store:"Amazon",account:"Personal",type:"Gift Card / Wallet",amount:100,initialAmount:120,currency:"USD",expiry:plusDays(27),notes:"",status:"active",hasSecretCode:true,codeVisibility:"public"},
      {id:"card-c",store:"Walmart",account:"Family",type:"Gift Card / Wallet",amount:90,initialAmount:90,currency:"CAD",expiry:plusDays(9),notes:"",status:"active",hasSecretCode:false,codeVisibility:"public"},
      {id:"card-d",store:"Indigo",account:"Personal",type:"Gift Card / Wallet",amount:40,initialAmount:40,currency:"CAD",expiry:plusDays(90),notes:"",status:"active",hasSecretCode:false,codeVisibility:"public"},
      {id:"card-e",store:"Uber Eats",account:"Family",type:"Gift Card / Wallet",amount:2000,initialAmount:2000,currency:"INR",expiry:plusDays(14),notes:"",status:"active",hasSecretCode:false,codeVisibility:"public"},
      {id:"card-f",store:"Sephora",account:"Personal",type:"Gift Card / Wallet",amount:0,initialAmount:80,currency:"CAD",expiry:plusDays(-5),notes:"Fully redeemed",status:"used",hasSecretCode:false,codeVisibility:"public"},
      {id:"card-g",store:"Tim Hortons",account:"Family",type:"Voucher",amount:25,initialAmount:25,currency:"CAD",expiry:plusDays(-3),notes:"Coffee gift voucher",status:"active",hasSecretCode:false,codeVisibility:"public"},
      {id:"card-h",store:"PRESTO",account:"Transit",type:"Transit",amount:90,initialAmount:120,currency:"CAD",expiry:null,notes:"Travel card",status:"active",hasSecretCode:false,codeVisibility:"public"},
      {id:"card-i",store:"Fictional Global Gift",account:"Demo",type:"Gift Card / Wallet",amount:80,initialAmount:80,currency:"CAD",expiry:plusDays(45),notes:"Fictional issuer-approved example; not a real brand",status:"active",hasSecretCode:false,codeVisibility:"public"}
    ],
    user:{id:"00000000-0000-4000-8000-0000000000a1",name:"Vault Member",email:"member@example.invalid",role:"super_admin"},
    members:[{name:"Vault Member",role:"super_admin"},{name:"Family Member",role:"viewer"}],
    unread:2,canAdd:true,historyAvailable:true,
    currencyPermissions:[{couponId:"card-i",sourceCurrency:"CAD",targetCurrency:"USD",active:true,verifiedBy:"fictional-admin",evidenceUrl:"https://issuer.example.invalid/fictional-card-terms",approvalNote:"SAMPLE ONLY — FICTIONAL ISSUER",validUntil:null}],
    transactions:[{id:"demo-t1",couponId:"card-b",type:"redemption",amountDelta:-20,balanceBefore:120,balanceAfter:100,currency:"USD",settlementCurrency:"USD",settlementAmount:20,createdAt:"2026-11-18T13:30:00Z"},{id:"demo-t2",couponId:"card-c",type:"adjustment",amountDelta:10,balanceBefore:80,balanceAfter:90,currency:"CAD",settlementCurrency:null,settlementAmount:null,createdAt:"2026-11-16T10:00:00Z"}]
  };
  const notify=message=>{const el=document.getElementById("demo-toast");el.textContent=message;el.hidden=false;clearTimeout(window.demoToastTimer);window.demoToastTimer=setTimeout(()=>el.hidden=true,3500)};

  let demoSpendId=null;
  function closeSampleSpend(){document.getElementById("demo-spend").hidden=true;demoSpendId=null;}
  function updateSampleSpend(){
    const c=demo.cards.find(x=>x.id===demoSpendId);if(!c)return;
    const target=document.getElementById("demo-spend-currency").value;
    const different=c.currency!==target;
    const allowed=!different||Boolean(window.GiftVaultCurrency.approvedFor(c,target,demo.currencyPermissions));
    document.getElementById("demo-merchant-wrap").hidden=!different;
    document.getElementById("demo-spend-confirm").disabled=!allowed;
    const message=document.getElementById("demo-spend-feedback");
    message.style.color=allowed?"#a6edc7":"#ffc9a1";
    message.textContent=!different
      ?"Same card and checkout currency. Original-currency balance will be reduced."
      :allowed
        ?"FICTIONAL issuer approval for this exact test card. Enter the merchant-confirmed "+target+" amount. No FX rate assumed."
        :"BLOCKED: No issuer-confirmed permission for "+c.currency+" → "+target+". The brand must explicitly allow this specific card.";
  }
  function openSampleSpend(id){
    const c=demo.cards.find(x=>x.id===id);if(!c)return;
    demoSpendId=id;
    document.getElementById("demo-spend-title").textContent="Sample spend — "+c.store;
    document.getElementById("demo-card-balance").textContent=window.GiftVaultCurrency.format(c.amount,c.currency)+" "+c.currency+" remaining";
    document.getElementById("demo-spend-debit").value="";
    document.getElementById("demo-merchant-charge").value="";
    document.getElementById("demo-spend-currency").value=c.currency;
    updateSampleSpend();
    document.getElementById("demo-spend").hidden=false;
  }
  function submitSampleSpend(){
    const c=demo.cards.find(x=>x.id===demoSpendId);if(!c)return;
    const target=document.getElementById("demo-spend-currency").value;
    const debit=document.getElementById("demo-spend-debit").value;
    const charge=document.getElementById("demo-merchant-charge").value;
    const r=window.GiftVaultCurrency.validate(c,target,debit,target===c.currency?null:charge,demo.currencyPermissions);
    const message=document.getElementById("demo-spend-feedback");
    if(!r.ok){message.textContent=r.message;message.style.color="#ffc9a1";return;}
    const balanceBefore=c.amount;c.amount=+(c.amount-r.cardDebit).toFixed(2);
    if(!c.amount)c.status="used";
    demo.transactions.unshift({id:"demo-"+Date.now(),couponId:c.id,type:"redemption",
      amountDelta:-r.cardDebit,balanceBefore,balanceAfter:c.amount,currency:c.currency,
      settlementCurrency:r.target,settlementAmount:r.chargedAmount,createdAt:new Date().toISOString()});
    closeSampleSpend();
    window.walletLiveRefresh?.();
    notify("SAMPLE ONLY: "+window.GiftVaultCurrency.format(r.cardDebit,c.currency)+" deducted from "+c.currency+" card; merchant checkout "+r.target+".");
  }
  document.addEventListener("DOMContentLoaded",()=>{
    document.getElementById("demo-spend-currency")?.addEventListener("change",updateSampleSpend);
    document.getElementById("demo-spend-confirm")?.addEventListener("click",submitSampleSpend);
    document.getElementById("demo-spend-cancel")?.addEventListener("click",closeSampleSpend);
  });

  let scanDraft=null;
  function showDemoScanDraft(draft){
    scanDraft={...draft,code:null,codeConfirmed:false}; // discard all secrets in the public demo
    document.getElementById("demo-scan-merchant").value=draft.store||"";
    document.getElementById("demo-scan-currency").value=draft.currency||"";
    document.getElementById("demo-scan-balance").value=draft.amount===null?"":String(draft.amount);
    document.getElementById("demo-scan-expiry").value=draft.expiry||"";
    document.getElementById("demo-scan-draft").hidden=false;
    document.getElementById("demo-scan-merchant").focus();
  }
  function dismissDemoScanDraft(){
    scanDraft=null;
    document.getElementById("demo-scan-draft").hidden=true;
  }
  function saveDemoScanDraft(event){
    event.preventDefault();
    if(!scanDraft)return;
    const brand=document.getElementById("demo-scan-merchant").value.trim();
    const currency=document.getElementById("demo-scan-currency").value;
    const amount=Number(document.getElementById("demo-scan-balance").value);
    const expiry=document.getElementById("demo-scan-expiry").value;
    if(!brand||!["INR","CAD","USD"].includes(currency)||
      !Number.isFinite(amount)||amount<0||!expiry)return;
    demo.cards.push({
      id:"scanned-demo-"+Date.now(),store:brand.slice(0,75),account:"Personal",
      type:"Gift Card / Wallet",amount,initialAmount:amount,
      currency,expiry,notes:"From fictional F05 scan demo — reviewed manually",
      status:amount>0?"active":"used",hasSecretCode:false,codeVisibility:"private"
    });
    dismissDemoScanDraft();
    window.walletLiveRefresh?.();
    notify("Sample card created after review (preview only). Codes discarded.");
  }
  document.addEventListener("DOMContentLoaded",()=>{
    document.getElementById("demo-scan-form")?.addEventListener("submit",saveDemoScanDraft);
    document.getElementById("demo-scan-dismiss")?.addEventListener("click",dismissDemoScanDraft);
  });

  window.giftVaultLiveBridge={
    snapshot:()=>demo,
    canEdit:()=>true,
    canSpend:()=>true,
    canReveal:id=>id!=="card-a",
    reveal:async id=>id==="card-b"?"SAMPLE-NOT-REDEEMABLE":null,
    hideCode:()=>{},
    request:()=>notify("Access requests work after sign-in."),
    add:()=>{const store=prompt("Enter a sample store name:");if(!store||!store.trim())return;demo.cards.push({id:"new-"+demo.cards.length,store:store.trim().slice(0,35),account:"Personal",type:"Gift Card / Wallet",amount:1000,expiry:"2027-01-01",notes:"",status:"active",hasSecretCode:false,codeVisibility:"public",currency:"CAD"});window.walletLiveRefresh();notify("Sample card added to this preview.")},
    scan:()=>window.GiftVaultScan.open({preview:true,onApply:showDemoScanDraft}),
    edit:()=>notify("Editing opens the existing secured form when signed in."),
    spend:id=>openSampleSpend(id),
    approveCurrency:()=>notify("Issuer verification is admin-only in the real connected application."),
    remind:()=>notify("Expiry reminders open Google Calendar when signed in."),
    refresh:async()=>{notify("Sample wallet is up to date.")},
    legacy:()=>notify("Management screens are available after sign-in."),
    backup:()=>notify("Backups are available to an administrator."),
    logout:()=>notify("Sign-out is handled by Supabase in the real app.")
  };
})();
</script>

\" class=\"gv-scan-secondary\">Discard and close</button><small>Only copies the reviewed fields. Save to Vault is a separate action.</small></footer></div>";

function status(text,kind="info"){const el=get("gv-scan-status");if(el){el.textContent=String(text);el.dataset.kind=kind;}}
function setBusy(value){

  for(const k of ["store","currency","amount","expiry"])get("gv-scan-"+k+"-confidence").textContent="";

  get("gv-scan-code-consent").checked=false;get("gv-scan-code-consent").disabled=true;

  result=p;
  for(const [id,key] of [["store","merchant"],["amount","amount"],["currency","currency"],["expiry","expiry"]]){
    const suggestion=p[key];
    get("gv-scan-"+id).value=suggestion?.value??"";

async function nativeOCR(){
  if(busy)return;

const filterFieldIds=["store","account","type","currency","status","expiry","sort","minBalance","maxBalance"];
function syncFilters(cards){
  const opts=filterApi.options(cards);
  for(const [field,values] of [["store",opts.stores],["account",opts.accounts],["type",opts.types]]){
    const select=$("wl-filter-"+field);
    const current=filters[field];
    const labels={store:"All stores",account:"All accounts",type:"All types"};
    const full=current!=="all"&&!values.includes(current)?[...values,current]:values;
    const signature=JSON.stringify(full);
    if(select.dataset.optionsSignature!==signature){
      select.innerHTML='<option value="all">'+labels[field]+'</option>'+
        full.map(value=>'<option value="'+esc(value)+'">'+esc(value)+'</option>').join("");
      select.dataset.optionsSignature=signature;
    }
    if(select.value!==current)select.value=current;
  }
  for(const field of ["currency","status","expiry","sort","minBalance","maxBalance"]){
    const control=$("wl-filter-"+field);
    if(control&&control!==document.activeElement&&control.value!==filters[field])control.value=filters[field];
  }
  const count=filterApi.activeCount(filters);
  const badge=$("wl-filter-active-count");
  badge.hidden=!count;
  badge.textContent=String(count);
  $("wl-clear-filters").hidden=!count;
}
function filterControlChange(e){
  const target=e.target;
  if(!target||!target.id)return;
  if(target.id==="wl-query"){filters={...filters,query:target.value};index=0;render();return;}
  if(!target.id.startsWith("wl-filter-"))return;
  const key=target.id.slice("wl-filter-".length);
  if(!filterFieldIds.includes(key))return;
  const currentData=snap();
  const distinct=new Set((currentData?.cards||[]).map(c=>c.currency||"INR"));
  const mixed=distinct.size>1;
  if(mixed&&filters.currency==="all"&&
    ((key==="sort"&&target.value.startsWith("balance"))||
     ((key==="minBalance"||key==="maxBalance")&&target.value!==""))){
    alert("Select one card currency before comparing balances. INR, CAD and USD cannot be compared without a documented FX rate.");
    target.value=filters[key];return;
  }
  const nextFields={...filters,[key]:target.value};
  if(mixed&&key==="currency"&&target.value==="all"&&
     (filters.sort.startsWith("balance")||filters.minBalance!==""||filters.maxBalance!=="")){
    nextFields.sort="expiry-asc";nextFields.minBalance="";nextFields.maxBalance="";
  }

  index=0;
  render();
}

  const dt=new Date(h.at);
  if(!Number.isNaN(+dt))when=dt.toLocaleDateString("en-CA",{month:"short",day:"numeric",year:"numeric"});
  return '<div class="wl-alert-history-row"><span><strong>'+label+'</strong> · '+esc(card?.store||"Removed card")+
    '<small>'+esc(stageText(h.stage))+(when?" · "+esc(when):"")+'</small></span></div>';
}
function thresholdOptions(selected,prefix,disabled){
  return api.STEPS.map(d=>'<label class="wl-alert-option"><input type="checkbox" data-'+prefix+'="'+d+'" '+(selected.includes(d)?"checked ":"")+(disabled?"disabled ":"")+'/>'+
    '<span>'+d+' day'+(d!==1?"s":"")+' before</span></label>').join("");
}
function render(){
  if(!mounted)return;
  const snap=evaluate();
  if(!snap)return;
  const unread=alerts.filter(a=>a.unread).length;
  const serverUnread=Number(snap.unread)||0;
  const badge=$("wl-badge");
  if(badge){badge.hidden=!(unread+serverUnread);badge.textContent=unread+serverUnread>99?"99+":String(unread+serverUnread);}
  const notif=rootElement()?.querySelector('[data-act="notifications"]');
  if(notif)notif.setAttribute("aria-label","Notifications: "+unread+" unread expiry alerts and "+serverUnread+" account notifications");
  const count=$("wl-alert-counter");if(count)count.textContent=unread+" unread";
  const list=$("wl-alert-list");
  if(list)list.innerHTML=alerts.length?alerts.map(allAlertMarkup).join(""):'<div class="wl-alert-empty">No expiry alerts right now. Your active cards will appear here when they reach a reminder date.</div>';
  const recent=$("wl-alert-history");
  if(recent)recent.innerHTML=settings.history.length?settings.history.slice(-12).reverse().map(historyMarkup).join(""):'<p class="wl-alert-note">No reminder activity yet.</p>';
  const srv=$("wl-account-notifications");
  if(srv)srv.textContent="Account notifications"+(serverUnread?" ("+serverUnread+" unread)":"");
  const enabled=$("wl-alert-enabled");
  if(enabled)enabled.checked=settings.enabled;
  const options=$("wl-alert-thresholds");
  if(options)options.innerHTML=thresholdOptions(settings.thresholds,"expiry-day",!settings.enabled);
  const summary=$("wl-alert-summary");
  if(summary)summary.textContent=settings.enabled?"Alerts appear only when the wallet is open. Timing is saved on this device.":"In-app expiry reminders are paused on this device.";
  if(cardId&&$("wl-card-reminder-dialog")&&!$("wl-card-reminder-dialog").hidden)renderCardControls();
}
function rootElement(){return $("giftWalletLive");}
function center(){
  if(!mounted)mount();
  if(!mounted||!data())return;
  window.walletLiveOpenSection?.("alerts");
  render();
}
function cardControls(){
  const s=data();const card=s?.cards.find(c=>c.id===cardId);
  if(!card)return '';
  const opts=settings.cards[cardId]||{enabled:true};
  const custom=Array.isArray(opts.thresholds);
  return '<p class="wl-alert-note">This changes reminders for <strong>'+esc(card.store)+'</strong> on this device only.</p>'+
  '<label class="wl-alert-toggle"><input id="wl-alert-card-enabled" type="checkbox" '+(opts.enabled!==false?"checked":"")+'/> Remind me about this card</label>'+
  '<label class="wl-alert-toggle"><input id="wl-alert-card-custom" type="checkbox" '+(custom?"checked":"")+'/> Customize timing for this card</label>'+
  '<div class="wl-alert-options" id="wl-alert-card-days">'+thresholdOptions(custom?opts.thresholds:settings.thresholds,"expiry-card-day",!custom||opts.enabled===false)+'</div>'+
  '<p class="wl-alert-note">If custom timing is off, this card follows your global schedule.</p>';
}
function renderCardControls(){const e=$("wl-alert-card-form");if(e)e.innerHTML=cardControls();}
function cardSettings(id){
  if(!mounted)mount();
  const snap=ensureAccount();
  if(!snap||!snap.cards.some(c=>c.id===id))return;
  cardId=id;
  renderCardControls();
  const dialog=$("wl-card-reminder-dialog");
  dialog.hidden=false;
  $("wl-card-reminder-close").focus();
}
function closeCard(){const el=$("wl-card-reminder-dialog");if(!el||el.hidden)return false;el.hidden=true;cardId=null;return true;}
function handleAction(e){
  const node=e.target.closest("[data-expiry-action]");
  if(!node)return;
  const action=node.dataset.expiryAction;
  if(action==="back"){window.walletLiveOpenSection?.("wallet");return;}
  if(action==="close-card"){closeCard();return;}
  if(action==="preferences"){window.walletLiveOpenSection?.("settings");$("wl-alert-settings")?.scrollIntoView({block:"start",behavior:"smooth"});return;}
  if(action==="server"){window.walletLiveShowClassic?.("notifications");return;}
  const selected=alerts.find(a=>a.id===node.dataset.alert);
  if(!selected)return;
  if(action==="open"){settings=api.act(settings,selected,"read");persist();render();window.walletLiveOpenCard?.(selected.cardId);return;}
  if(["read","snoozed","dismissed"].includes(action)){settings=api.act(settings,selected,action);persist();render();}
}
function onChange(e){
  const snap=ensureAccount();if(!snap)return;
  const el=e.target;
  if(el.id==="wl-alert-enabled"){settings=api.setEnabled(settings,el.checked);persist();render();return;}
  if(el.dataset.expiryDay){settings=api.setThreshold(settings,+el.dataset.expiryDay,el.checked);persist();render();return;}
  if(!cardId)return;
  if(el.id==="wl-alert-card-enabled"){settings=api.setCardEnabled(settings,cardId,el.checked);persist();render();return;}
  if(el.id==="wl-alert-card-custom"){
    settings=api.setCardSchedule(settings,cardId,el.checked?settings.thresholds:null);
    persist();render();return;
  }
  if(el.dataset.expiryCardDay){
    const old=settings.cards[cardId]?.thresholds||settings.thresholds;
    const day=+el.dataset.expiryCardDay;
    const next=api.STEPS.filter(d=>d===day?el.checked:old.includes(d));
    settings=api.setCardSchedule(settings,cardId,next);
    persist();render();
  }
}
function markup(){
  return '<section id="wl-view-alerts" class="wl-view" hidden>'+
   '<div class="wl-title"><div><small>YOUR REMINDERS</small><h1>Expiry alerts</h1><p>Make every gift card count.</p></div>'+
   '<button type="button" class="wl-outline" data-expiry-action="preferences">Preferences</button></div>'+
   '<div class="wl-alert-summary"><span id="wl-alert-counter">0 unread</span><span>In-app reminders · This device</span></div>'+
   '<div class="wl-list" id="wl-alert-list"></div>'+
   '<div class="wl-panel wl-alert-account"><h2>Other activity</h2><p>Code access approvals and messages from your shared vault.</p>'+
   '<button type="button" class="wl-outline" id="wl-account-notifications" data-expiry-action="server">Account notifications</button></div>'+
   '<div class="wl-panel wl-alert-activity"><h2>Recent reminder activity</h2><div id="wl-alert-history"></div></div>'+
   '<button type="button" class="wl-link" data-expiry-action="back">Back to wallet</button></section>';
}
function settingsMarkup(){
  return '<div class="wl-panel wl-alert-settings" id="wl-alert-settings"><h2>Expiry reminders</h2>'+
   '<p id="wl-alert-summary">Alerts appear only when your wallet is open.</p>'+
   '<label class="wl-alert-toggle"><input id="wl-alert-enabled" type="checkbox" checked /> Enable in-app reminders</label>'+
   '<div class="wl-alert-options" id="wl-alert-thresholds"></div>'+
   '<p class="wl-alert-note">Alerts also appear on the expiry day or if a card remains active after expiring. Email and push are not yet enabled.</p>'+
   '</div>';
}
function cardModalMarkup(){
  return '<div id="wl-card-reminder-dialog" class="wl-overlay" hidden>'+
   '<div class="wl-dialog wl-alert-dialog" role="dialog" aria-modal="true" aria-labelledby="wl-alert-card-title">'+
   '<div class="wl-dialog-top"><h2 id="wl-alert-card-title">Card reminders</h2><button type="button" id="wl-card-reminder-close" data-expiry-action="close-card">Close</button></div>'+
   '<div id="wl-alert-card-form"></div></div></div>';
}
function mount(){
  if(mounted)return;
  const root=rootElement();
  if(!root||!root.querySelector("#wl-view-settings"))return;
  root.querySelector("#wl-view-settings").insertAdjacentHTML("beforebegin",markup());
  root.querySelector("#wl-view-settings .wl-settings").insertAdjacentHTML("beforebegin",settingsMarkup());
  root.insertAdjacentHTML("beforeend",cardModalMarkup());
  root.addEventListener("click",handleAction);
  root.addEventListener("change",onChange);
  $("wl-card-reminder-dialog").addEventListener("click",e=>{if(e.target===$("wl-card-reminder-dialog"))closeCard();});
  document.addEventListener("keydown",e=>{if(e.key==="Escape")closeCard();});
  mounted=true;
  render();
}
function refresh(){if(!mounted)mount();render();}
window.walletExpiryOpenCenter=center;
window.walletExpiryOpenCardSettings=cardSettings;
window.walletExpiryHandleBack=closeCard;
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",mount,{once:true});else mount();
document.addEventListener("visibilitychange",()=>{if(!document.hidden)refresh();});
window.addEventListener("focus",refresh);
// In-app only: a foreground timer refreshes the date and local alert badges.
// No service-worker push is scheduled and nothing runs after the app is closed.
setInterval(()=>{if(!document.hidden&&rootElement()&&!rootElement().hidden)refresh();},60000);
const oldRefresh=window.walletLiveRefresh;
if(typeof oldRefresh==="function")window.walletLiveRefresh=function(){oldRefresh.apply(this,arguments);refresh();};
const oldStart=window.walletLiveStart;
if(typeof oldStart==="function")window.walletLiveStart=function(){oldStart.apply(this,arguments);refresh();};
})();</script>
</body></html>
